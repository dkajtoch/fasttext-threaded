[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "fasttext-parallel"
version = "0.1.0"
description = "fastText inference with one loaded model and native C++ batch parallelism"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fasttext-parallel contributors" }]
keywords = ["fasttext", "inference", "parallel", "pybind11", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23,<2"]

[project.optional-dependencies]
test = ["fasttext>=0.9.2", "pytest>=8.0", "pytest-cov>=5.0"]
bench = ["fasttext>=0.9.2", "matplotlib>=3.8", "psutil>=5.9"]
dev = ["mypy>=1.10", "pre-commit>=3.7", "ruff>=0.6", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/dariuszkajtoch/fasttext-parallel"
Repository = "https://github.com/dariuszkajtoch/fasttext-parallel"

[tool.scikit-build]
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/fasttext_parallel"]
sdist.include = [
  "CMakeLists.txt",
  "cpp",
  "src",
  "tests",
  "benchmarks",
  "stress",
  "scripts",
  ".clang-format",
  ".pre-commit-config.yaml",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B018"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "benchmarks", "stress"]
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["fasttext", "psutil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
